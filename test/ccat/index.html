<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Canna Cat D.C. - Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Oxygen+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #cccccc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Oxygen Mono', monospace;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 2px dashed var(--text-color);
            padding-bottom: 20px;
        }
        header h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
        }
        header p {
            margin: 5px 0;
            font-size: 1rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .section {
            margin-bottom: 60px;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 10px;
        }
        
        /* Modern Fluid Image Icon Styling */
        .section-image-icon {
            /* clamp(MIN, FLUID_VALUE, MAX) caps at 100px, but dynamically shrinks on small screens */
            width: clamp(50px, 15vw, 100px);
            height: auto;
            object-fit: contain;
            flex-shrink: 0; 
        }

        /* 
        =========================================================================================
        ARCHIVED SVG CSS: COMMENTED OUT FOR PRESERVATION
        =========================================================================================
        .section-icon {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: var(--text-color);
            stroke-width: 2;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }
        .icon-flower path { d: path("M20 2L22 10L30 8L25 18L35 22L25 26L28 36L20 30L12 36L15 26L5 22L15 18L10 8L18 10Z"); }
        .icon-oil path { d: path("M20 2L26 15L32 20L28 30L20 38L12 30L8 20L14 15Z M20 2L20 38"); }
        .icon-edible path { d: path("M5 20L10 5L30 5L35 20L20 35Z M5 20L35 20"); }
        .icon-shroom path { d: path("M20 2L35 15L30 20L10 20L5 15Z M15 20L12 38L28 38L25 20"); }
        =========================================================================================
        */

        .section-header h2 {
            font-size: 2rem;
            text-transform: uppercase;
            margin: 0;
        }
        .section-desc {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 25px;
            max-width: 100%;
        }
        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .item {
            margin-bottom: 20px;
            padding-left: 15px;
            border-left: 3px solid var(--text-color);
        }
        .item-title {
            font-weight: bold;
            font-size: 1.2rem;
        }
        .item-title a {
            color: var(--text-color);
            text-decoration: underline;
            text-decoration-style: dotted;
        }
        .item-title a:hover {
            color: var(--bg-color);
            background-color: var(--text-color);
        }
        /* Style for the New/Low indicator dot to keep it vertically aligned nicely */
        .status-dot {
            font-size: 0.75em;
            vertical-align: middle;
            margin-left: 6px;
        }
        .item-details {
            font-size: 0.95rem;
            margin: 5px 0;
        }
        .item-price {
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div style="text-align: center;">
                <img 
                src="https://raw.githubusercontent.com/pat-bee/pat-bee.github.io/main/test/ccat/ccat-b.png" 
                onmouseover="this.src='https://raw.githubusercontent.com/pat-bee/pat-bee.github.io/main/test/ccat/ccat-a.png'" 
                onmouseout="this.src='https://raw.githubusercontent.com/pat-bee/pat-bee.github.io/main/test/ccat/ccat-b.png'" 
                ontouchstart="this.src='https://raw.githubusercontent.com/pat-bee/pat-bee.github.io/main/test/ccat/ccat-a.png'"
                ontouchend="this.src='https://raw.githubusercontent.com/pat-bee/pat-bee.github.io/main/test/ccat/ccat-b.png'"
                style="width: 400px; cursor: pointer; max-width: 100%; height: auto;" 
                alt="Interactive image"
                />
            </div>
            <p><strong><a href="https://cal.com/real-fake-sally/meetup" style="color: #ffffff; text-decoration: none;">Say Hello!</a></strong>| Delivery & Pickup</p>
            <p>$60 minimum | Updated 9/14/26</p>
            <!-- Legend to explain the dots to users -->
            <p style="font-size: 0.85rem; color: var(--accent-color); margin-top: 15px;">
                <span style="color: #9588f5;">⬤</span> New Arrival &nbsp;&nbsp; | &nbsp;&nbsp; <span style="color: #d22e20;">⬤</span> Low Stock
            </p>
        </header>

        <div id="menu-content">
            <!-- Data will be populated here via JavaScript -->
        </div>
    </div>

    <script>
        const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnZ9yBY66oMwlzyph1tC-S9_n_itMwc4AIafSuDXMPa7S4TdivY4y-jekeGqIq4sQ4B9j47y9CnmKq/pub?gid=447341126&single=true&output=csv"; 

        // Updated Static fallback data with isNew and isLow properties to demonstrate the dots
        const staticMenuData = [
            {
                category: "Flower",
                iconUrl: "https://pat-bee.github.io/test/ccat/bud-icon.png",
                description: "All indoor premium flower unless noted. Save cash by mixing and matching 1/4oz+ strains for bulk pricing. Potent, frosty, and meticulously sourced for the highest quality.",
                items: [
                    { name: "Lemonberry", desc: "Euphoric & bright with Tangie notes. Dabney Blue X Lemon Thai.", price: "$35/e, $60/q, 90/h, 170/oz", link: "https://www.jointcommerce.com/blog/lemonberry-strain-a-comprehensive-strain-guide", isNew: true, isLow: false },
                    { name: "StrawNana Sorbet", desc: "Dessert forward creamy sweet Strawberry x Banana Kush.", price: "35e, 60q, 90h, 170oz", link: "#", isNew: false, isLow: true },
                    { name: "Scissor Queen", desc: "Medium/large frosty buds with purple bits. Indica leaning hybrid.", price: "30e, 60q, 90h, 170oz", link: "#", isNew: true, isLow: true },
                    { name: "Toad Venom", desc: "Tart mint, diesel, chemical gas, skunk, citrus, pepper.", price: "30/e, 60/q, 90/h, 170/oz", link: "#", isNew: false, isLow: false },
                    { name: "Zebra Stripes", desc: "Chunky potent buds! Lemon cherry gelato X Animal box Bx.", price: "$35/e, $60/q, $90/h, 170/oz", link: "#", isNew: false, isLow: false }
                ]
            }
        ];

        function renderMenu(data) {
            const container = document.getElementById('menu-content');
            container.innerHTML = '';

            data.forEach(section => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'section';

                const headerHtml = `
                    <div class="section-header">
                        <img src="${section.iconUrl}" alt="${section.category} icon" class="section-image-icon" />
                        <h2>${section.category}</h2>
                    </div>
                    <p class="section-desc">${section.description}</p>
                `;
                
                const ul = document.createElement('ul');
                ul.className = 'item-list';

                section.items.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'item';
                    
                    // Generate the colored dots based on the flags
                    let indicatorDots = '';
                    if (item.isNew) {
                        indicatorDots += '<span class="status-dot" style="color: #9588f5;" title="New">⬤</span>';
                    }
                    if (item.isLow) {
                        indicatorDots += '<span class="status-dot" style="color: #d22e20;" title="Low Stock">⬤</span>';
                    }

                    // Append the dots directly after the item name/link
                    const titleHtml = (item.link && item.link !== "#" && item.link.trim() !== ""
                        ? `<a href="${item.link}" target="_blank" rel="noopener">${item.name}</a>` 
                        : item.name) + indicatorDots;

                    li.innerHTML = `
                        <div class="item-title">${titleHtml}</div>
                        <div class="item-details">${item.desc}</div>
                        <span class="item-price">${item.price}</span>
                    `;
                    ul.appendChild(li);
                });

                sectionDiv.innerHTML = headerHtml;
                sectionDiv.appendChild(ul);
                container.appendChild(sectionDiv);
            });
        }

        function parseCSV(csvText) {
            const lines = csvText.split('\n');
            const dataLines = lines.slice(1); // Skip header row
            const menuMap = new Map();
            
            dataLines.forEach(line => {
                if (!line.trim()) return;
                
                // Regex to handle commas inside quotes correctly
                const match = line.match(/(?<=^|,)(?:"([^"]*)"|([^,]*))/g);
                
                // Ensure we have enough columns. 
                if (!match || match.length < 5) return; 
                
                // Map columns by index:
                // 0: Category | 1: CatDescription | 2: Name | 3: Desc | 4: Price | 5: Link | 6: New | 7: Low
                const category = (match[0] || '').replace(/^"|"$/g, '').trim();
                const categoryDesc = (match[1] || '').replace(/^"|"$/g, '').trim(); 
                const name = (match[2] || '').replace(/^"|"$/g, '').trim();
                const desc = (match[3] || '').replace(/^"|"$/g, '').trim();
                const price = (match[4] || '').replace(/^"|"$/g, '').trim();
                const link = (match[5] || '').replace(/^"|"$/g, '').trim();
                
                // Check columns 7 and 8 (index 6 and 7) for an "x"
                const newFlag = (match[6] || '').replace(/^"|"$/g, '').trim().toLowerCase();
                const lowFlag = (match[7] || '').replace(/^"|"$/g, '').trim().toLowerCase();

                if (!category || !name) return;

                if (!menuMap.has(category)) {
                    let iconUrl = 'https://pat-bee.github.io/test/ccat/bud-icon.png';
                    const catLower = category.toLowerCase();
                    
                    if (catLower.includes('concentrate')) {
                        iconUrl = 'https://pat-bee.github.io/test/ccat/concentrate-icon.png';
                    } else if (catLower.includes('vape')) {
                        iconUrl = 'https://pat-bee.github.io/test/ccat/icon-vape-200.png';
                    } else if (catLower.includes('edible')) {
                        iconUrl = 'https://pat-bee.github.io/test/ccat/pie-icon.png';
                    } else if (catLower.includes('oil')) {
                        iconUrl = 'https://pat-bee.github.io/test/ccat/tincture-icon.png';
                    } else if (catLower.includes('mushroom')) {
                        iconUrl = 'https://pat-bee.github.io/test/ccat/mush-icon.png';
                    } else if (catLower.includes('merch') || catLower.includes('misc')) {
                        iconUrl = 'https://pat-bee.github.io/test/ccat/swag-icon.png';
                    }

                    menuMap.set(category, {
                        category: category,
                        iconUrl: iconUrl,
                        description: categoryDesc || "Premium items available for delivery or pickup.", 
                        items: []
                    });
                } else if (categoryDesc && !menuMap.get(category).description.includes(categoryDesc)) {
                    menuMap.get(category).description = categoryDesc;
                }
                
                // Push the parsed isNew and isLow booleans into the array
                menuMap.get(category).items.push({ 
                    name, 
                    desc, 
                    price, 
                    link,
                    isNew: newFlag === 'x',
                    isLow: lowFlag === 'x'
                });
            });

            return Array.from(menuMap.values());
        }

        async function init() {
            if (SPREADSHEET_CSV_URL && SPREADSHEET_CSV_URL !== "YOUR_PUBLISHED_CSV_URL_HERE") {
                try {
                    const response = await fetch(SPREADSHEET_CSV_URL);
                    if (!response.ok) throw new Error("Network response was not ok: " + response.statusText);
                    
                    const csvText = await response.text();
                    const parsedData = parseCSV(csvText);
                    
                    if (parsedData.length > 0) {
                        renderMenu(parsedData);
                    } else {
                        console.warn("CSV parsed successfully but no data was found. Falling back to static data.");
                        renderMenu(staticMenuData);
                    }
                } catch (error) {
                    console.error("Error fetching or parsing sheet:", error);
                    renderMenu(staticMenuData);
                }
            } else {
                renderMenu(staticMenuData);
            }
        }

        init();
    </script>
</body>
</html>

            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 10px;
        }
        .section-icon {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: var(--text-color);
            stroke-width: 2;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }
        .section-header h2 {
            font-size: 2rem;
            text-transform: uppercase;
            margin: 0;
        }
        .section-desc {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 25px;
            max-width: 100%;
        }
        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .item {
            margin-bottom: 20px;
            padding-left: 15px;
            border-left: 3px solid var(--text-color);
        }
        .item-title {
            font-weight: bold;
            font-size: 1.2rem;
        }
        .item-title a {
            color: var(--text-color);
            text-decoration: underline;
            text-decoration-style: dotted;
        }
        .item-title a:hover {
            color: var(--bg-color);
            background-color: var(--text-color);

        .item-details {

        function renderMenu(data) {
            const container = document.getElementById('menu-content');
            container.innerHTML = '';

            data.forEach(section => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'section';

                const headerHtml = `
                    <div class="section-header">
                        <svg class="section-icon ${section.iconClass}" viewBox="0 0 40 40">
                            <path />
                        </svg>
                        <h2>${section.category}</h2>
                    </div>
                    <p class="section-desc">${section.description}</p>
                `;
                
                const ul = document.createElement('ul');
                ul.className = 'item-list';

                section.items.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'item';
                    
                    const titleHtml = item.link && item.link !== "#" 
                        ? `<a href="${item.link}" target="_blank" rel="noopener">${item.name}</a>` 
                        : item.name;

                    li.innerHTML = `
                        <div class="item-title">${titleHtml}</div>
                        <div class="item-details">${item.desc}</div>
                        <span class="item-price">${item.price}</span>
                    `;
                    ul.appendChild(li);
                });

                sectionDiv.innerHTML = headerHtml;
                sectionDiv.appendChild(ul);
                container.appendChild(sectionDiv);
            });
        }

        // Logic to fetch from Google Sheets or load static fallback
        async function init() {
            if (SPREADSHEET_CSV_URL) {
                try {
                    const response = await fetch(SPREADSHEET_CSV_URL);
                    const csvText = await response.text();

                    // For now, if URL is empty, it falls back to the static data
                } catch (error) {
                    console.error("Error fetching sheet:", error);
                    renderMenu(staticMenuData);
                }
            } else {
                renderMenu(staticMenuData);
            }
        }

        init();
    </script>
